[package]
name = "suri"
version = "0.0.0"
edition = "2024"
# 1.88 is the first release with let chains (edition 2024), which suri's code
# may use. Dependencies alone would allow 1.85, the edition's own floor.
rust-version = "1.88.0"
description = "A Rust client for the Alpaca Trading and Market Data APIs"
repository = "https://github.com/saxena-dev/suri"
readme = "README.md"
keywords = ["alpaca", "trading", "market-data", "finance", "api"]
categories = ["api-bindings", "finance"]
authors = ["Paresh Saxena <pareshsaxena@gmail.com>"]
license = "MIT"
# Tooling, CI configuration, tests and test data (some under other licences)
# stay out of the published crate.
exclude = ["/.github", "/vendor", "/tools", "/tests"]

[features]
default = ["rest"]
# The HTTP client and every type that only it reads.
rest = ["dep:reqwest", "dep:url", "dep:secrecy", "dep:serde_json", "serde/derive", "dep:tokio", "dep:tracing"]
# The Trading and Market Data streams over WebSocket. They reuse the client
# and its types, so they require `rest`.
stream = ["rest", "dep:tokio-tungstenite", "dep:futures-util", "dep:rustls", "dep:rustls-platform-verifier", "dep:rmp-serde", "dep:rmp"]

[dependencies]
# Decoding and encoding of suri's value types, which implement their serde
# traits by hand to control exactly what they accept. Response types derive
# theirs (the `derive` feature arrives with `rest`).
serde = { version = "1.0.229", default-features = false, features = ["std"] }
# HTTP/1.1 over rustls; no proxy, redirect, retry or decompression support is
# used (see the client builder).
reqwest = { version = "0.13.5", default-features = false, features = ["rustls"], optional = true }
# Builds request URLs from encoded path segments.
url = { version = "2.5.8", optional = true }
# Holds the API key pair so it never reaches Debug output.
secrecy = { version = "0.10.3", default-features = false, optional = true }
# Decodes response bodies; float_roundtrip reads JSON numbers to the
# correctly rounded nearest f64, and raw_value keeps a nested body's text.
serde_json = { version = "1.0.154", optional = true, features = ["float_roundtrip", "raw_value"] }
# Waits between the attempts of a read.
tokio = { version = "1.53.3", features = ["time"], optional = true }
# One span per call and its events; suri installs no subscriber.
tracing = { version = "0.1.44", default-features = false, features = ["std"], optional = true }
# The WebSocket client; suri passes its own rustls configuration, so the
# feature that enables the rustls connector is the only TLS feature used.
tokio-tungstenite = { version = "0.29.0", default-features = false, features = ["connect", "rustls-tls-native-roots"], optional = true }
# Reads and writes the WebSocket through its Stream and Sink traits.
futures-util = { version = "0.3.34", default-features = false, features = ["sink", "std"], optional = true }
# The WebSocket's TLS configuration, built with an explicit provider and the
# platform's certificate verifier, as the HTTP client's is.
rustls = { version = "0.23.45", default-features = false, features = ["std", "tls12", "aws_lc_rs"], optional = true }
rustls-platform-verifier = { version = "0.7.1", optional = true }
# The options stream's MessagePack: decodes its elements and encodes its
# subscriptions.
rmp-serde = { version = "1.3.1", optional = true }
# Reads a MessagePack frame's array header, to split it into elements.
rmp = { version = "0.8.15", optional = true }

[dev-dependencies]
# Re-hashes the fixture tree in tests/fixture_manifest.rs.
sha2 = "0.10.9"
# Reads the upstream fixture index, and drives the JSON decoding tests.
serde_json = "1.0.154"
# Runs the client's async tests.
tokio = { version = "1.53.3", features = ["macros", "rt"] }
# Capture every log record and tracing span and event in the observability
# tests.
log = "0.4.34"
tracing-subscriber = { version = "0.3.23", default-features = false, features = ["registry"] }
# Turns on rustls' second crypto provider in every test build, so the tests
# show the stream's TLS setup never relies on rustls' default provider.
rustls = { version = "0.23.45", default-features = false, features = ["ring"] }
