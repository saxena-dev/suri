# Runs the same verification gate as a local `scripts/verify.sh --full --msrv`:
# formatting, clippy with warnings denied and the tests on every feature row,
# the tests with serde_json's arbitrary_precision on, rustdoc with warnings
# denied, the package-content check, and a check and test run on the minimum
# supported Rust version (`rust-version` in Cargo.toml). Stable stays the
# default toolchain; the minimum version is used only for the MSRV run. The
# feature rows live in the script, so this file does not change when features
# do.
name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  verify:
    name: verify (stable and MSRV)
    # A named image, so the runner changes only by a commit.
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v5
      - name: Install Rust stable
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt,clippy
          rustup default stable
          rustc --version
      - name: Install the minimum supported Rust version
        run: |
          rv=$(sed -n 's/^rust-version *= *"\(.*\)"/\1/p' Cargo.toml)
          rustup toolchain install "$rv" --profile minimal
          rustc "+$rv" --version
      - name: Verify
        run: scripts/verify.sh --full --msrv

  # Coverage of the all-features test run, uploaded to Codecov for the README
  # badge. The upload needs the CODECOV_TOKEN repository secret; a failed
  # upload does not fail the build. As in the gate, every test binary runs
  # under the watchdog, and the job has a time limit of its own.
  coverage:
    name: coverage
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    env:
      CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_RUNNER: ${{ github.workspace }}/scripts/watchdog
    steps:
      - uses: actions/checkout@v5
      - name: Install Rust stable
        run: |
          rustup toolchain install stable --profile minimal --component llvm-tools-preview
          rustup default stable
          rustc --version
      - uses: taiki-e/install-action@cargo-llvm-cov
      - run: cargo llvm-cov --locked --all-features --lcov --output-path lcov.info
      - name: Coverage summary
        run: |
          {
            echo '```'
            cargo llvm-cov report --summary-only
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: codecov/codecov-action@v5
        with:
          files: lcov.info
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false
